name: Nymrel Remote contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'remote-control/**'
      - '.github/workflows/remote-control-ci.yml'
  push:
    branches: [main]
    paths:
      - 'remote-control/**'
      - '.github/workflows/remote-control-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nymrel-remote-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-contract:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.20.0']
    defaults:
      run:
        working-directory: remote-control
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Confirm reviewed npm toolchain
        run: corepack npm@12.0.2 --version

      - name: Install locked package metadata
        run: corepack npm@12.0.2 ci --ignore-scripts

      - name: Run remote-control contract suite
        run: corepack npm@12.0.2 run check

      - name: Audit production dependency graph
        run: corepack npm@12.0.2 audit --omit=dev --audit-level=high

      - name: Verify package allowlist
        run: corepack npm@12.0.2 pack --dry-run

  windows-contract:
    name: Windows native backend
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: remote-control
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Confirm reviewed npm toolchain
        run: corepack npm@12.0.2 --version

      - name: Install locked package metadata
        run: corepack npm@12.0.2 ci --ignore-scripts

      - name: Run syntax contracts on Windows
        run: corepack npm@12.0.2 run check:syntax

      - name: Parse Windows autostart installer
        shell: pwsh
        run: "[void][scriptblock]::Create((Get-Content -Raw './bin/install-nymrel-remote-windows.ps1'))"

      - name: Run native backend contracts on Windows
        run: node --test test/native-local-client.test.js

  container-contract:
    name: Container production smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --pull --tag nymrel-remote:ci remote-control

      - name: Start production image with an anonymous volume
        run: |
          docker run --rm --detach --name nymrel-remote-ci \
            -e NYMREL_REMOTE_PUBLIC_URL=https://remote.example.test \
            -e NYMREL_REMOTE_SIGNING_KEY=1111111111111111111111111111111111111111111111111111111111111111 \
            -e NYMREL_REMOTE_DATA_KEY=2222222222222222222222222222222222222222222222222222222222222222 \
            -e NYMREL_REMOTE_AUDIT_KEY=3333333333333333333333333333333333333333333333333333333333333333 \
            -e NYMREL_REMOTE_BOOTSTRAP_TOKEN=ci-bootstrap-token-not-a-production-secret \
            -e NYMREL_REMOTE_ALLOW_STATIC_MCP_TOKENS=true \
            -e NYMREL_REMOTE_ALLOW_STATIC_ADMIN_TOKENS=true \
            nymrel-remote:ci

      - name: Verify health and dropped runtime privilege
        run: |
          trap 'docker rm -f nymrel-remote-ci >/dev/null 2>&1 || true' EXIT
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' nymrel-remote-ci)"
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then docker logs nymrel-remote-ci; exit 1; fi
            sleep 1
          done
          if [ "$status" != healthy ]; then docker logs nymrel-remote-ci; exit 1; fi
          pid_uid="$(docker exec nymrel-remote-ci sh -c "awk '/^Uid:/ {print \$2; exit}' /proc/1/status")"
          test "$pid_uid" = 1000
          docker exec nymrel-remote-ci node -e "fetch('http://127.0.0.1:8787/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
