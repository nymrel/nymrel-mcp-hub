name: JalenPC runner capability probe

on:
  push:
    branches:
      - chatgpt/jalenpc-runner-probe-20260909

permissions:
  contents: read

concurrency:
  group: jalenpc-runner-probe
  cancel-in-progress: true

jobs:
  close-probe:
    name: Close unavailable JalenPC runner probe
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "No matching self-hosted Windows runner accepted the bounded JalenPC probe."
