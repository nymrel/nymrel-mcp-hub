name: Nymrel MCP Hub contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nymrel-mcp-hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-contract:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ["22.23.2", "24.20.0"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # setup-node's cache probe invokes the runner-bundled npm before the
          # reviewed npm 12 toolchain is active. devEngines correctly rejects
          # that older npm, so keep bootstrap caching explicitly disabled.
          package-manager-cache: false

      - name: Confirm the npm toolchain
        run: corepack npm@12.0.2 --version

      - name: Install locked dependencies
        run: corepack npm@12.0.2 ci

      - name: Verify TypeScript, protocol behavior, and CI contracts
        run: corepack npm@12.0.2 run verify

      - name: Audit the complete dependency graph
        run: corepack npm@12.0.2 audit --audit-level=high

      - name: Audit production dependencies
        run: corepack npm@12.0.2 audit --omit=dev --audit-level=high

      - name: Reject unreviewed install scripts
        run: corepack npm@12.0.2 install-scripts ls

  python-contract:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Use the reviewed Python toolchain
        run: python -m pip install --upgrade pip==26.2.1

      - name: Install development dependencies and the package
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --editable .

      - name: Check dependency integrity
        run: python -m pip check

      - name: Lint Python sources
        run: python -m ruff check python tests

      - name: Scan Python sources
        run: python -m bandit -q -r python/nymrel_mcp_hub

      - name: Compile Python sources
        run: python -m compileall -q python tests

      - name: Run the Python protocol suite
        run: python -m pytest -q

      - name: Audit the resolved third-party Python environment
        run: |
          python -m pip uninstall --yes nymrel-mcp-hub
          python -m pip_audit --strict

  python-package:
    name: Python distribution contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the reviewed packaging toolchain
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --requirement requirements-dev.txt

      - name: Build isolated distributions
        run: python -m build --outdir "$RUNNER_TEMP/python-dist"

      - name: Validate distribution metadata
        run: python -m twine check "$RUNNER_TEMP/python-dist/"*

      - name: Reject tests and verify package modules
        run: >-
          python -c "import os, pathlib, zipfile;
          wheel=next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'python-dist').glob('*.whl'));
          names=zipfile.ZipFile(wheel).namelist();
          assert any(name == 'nymrel_mcp_hub/__init__.py' for name in names);
          assert not any(name.startswith('tests/') or name.startswith('python/tests/') for name in names);
          print(f'validated {wheel.name}: {len(names)} entries')"

      - name: Install the built wheel in isolation
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/python" -m pip install "$RUNNER_TEMP/python-dist/"*.whl
          "$RUNNER_TEMP/consumer/bin/python" -c "import nymrel_mcp_hub; print(nymrel_mcp_hub.__version__)"
          "$RUNNER_TEMP/consumer/bin/nymrel-mcp" --list-tools

  workflow-security:
    name: GitHub Actions security contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Required to inspect repository workflows in online audit mode.

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/
          version: 1.29.0
          persona: pedantic
          advanced-security: false
          annotations: false
