[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nymrel-mcp-hub"
version = "1.0.0"
description = "Unified Model Context Protocol (MCP) server aggregating all 14 Nymrel open-source agent tools into a single zero-dependency hub"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nymrel", email = "contact@nymrel.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "nymrel",
    "ai-agents",
    "claude-desktop",
    "cursor",
    "codex",
    "zero-dependency"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries"
]
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10"
]

[project.scripts]
nymrel-mcp = "nymrel_mcp_hub.cli:main"

[project.urls]
Homepage = "https://nymrel.com"
Repository = "https://github.com/nymrel/nymrel-mcp-hub"
Issues = "https://github.com/nymrel/nymrel-mcp-hub/issues"

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["python"]
include = ["nymrel_mcp_hub*"]
exclude = ["tests*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["python"]
addopts = "-p no:asyncio"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
